<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bendi · share image</title>
<!-- Template for og.png (1200x630), the image shown when the website is shared. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1d2b53; }
  body { color: #fff1e8; position: relative; font-family: "IBM Plex Sans", sans-serif; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 56px; padding: 0 72px; }
  .me { width: 248px; height: 248px; image-rendering: pixelated; background: #18224a; padding: 16px; flex: none;
    clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); }
  .hi { font: 500 24px "JetBrains Mono", monospace; color: #ffec27; }
  .hi::before { content: ""; display: inline-block; width: 12px; height: 12px; background: #ffec27; box-shadow: 4px 4px 0 #7e2553; margin-right: 14px; }
  h1 { margin: 16px 0 0; font: 700 72px/1.05 "JetBrains Mono", monospace; letter-spacing: -0.03em; }
  .cls { font: 600 24px "JetBrains Mono", monospace; color: #29adff; margin-top: 18px; }
  .tag { font: 400 30px "IBM Plex Sans", sans-serif; color: #b9bcd0; margin-top: 12px; }
  .url { position: absolute; right: 72px; bottom: 32px; font: 500 22px "JetBrains Mono", monospace; color: #b9bcd0; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; display: flex; }
  .bar i { flex: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="me" src="img/bendi.svg" alt="">
    <div>
      <div class="hi">Hola, soy Bendi</div>
      <h1>Sergio Bendaña</h1>
      <div class="cls">Automation Platform Engineer</div>
      <div class="tag">20 años automatizando infraestructura<br>y juegos de 8 bits hechos en casa</div>
    </div>
  </div>
  <div class="url">serbenda.github.io/serbenda</div>
  <div class="bar"><i style="background:#29adff"></i><i style="background:#00e436"></i><i style="background:#ffec27"></i><i style="background:#ff77a8"></i><i style="background:#7e2553"></i></div>
</body>
</html>
